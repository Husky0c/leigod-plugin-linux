services:
  leigod-plugin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leigod-plugin
    privileged: true
    cap_add:
      - CAP_NET_ADMIN
      - CAP_SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - ./logs:/tmp/acc/log
      - ./config:/opt/leigod/config
    tmpfs:
      - /run:rw,exec,size=64M
      - /tmp:rw,exec,size=64M
      - /var/lib/leigod:rw,exec,size=64M